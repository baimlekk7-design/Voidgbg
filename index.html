<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Group</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f7f7;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 360px;
      padding: 34px 28px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      text-align: center;
    }

    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #d92323;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 23px;
      font-weight: 650;
      letter-spacing: -0.3px;
    }

    p {
      margin: 0 0 24px;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 7px;
      background: #d92323;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #bd1e1e;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .status {
      margin-top: 13px;
      min-height: 18px;
      color: #888;
      font-size: 12px;
    }
  </style></head><body>  <main class="box">
    <div class="mark">G</div><h1>Group</h1>

<p>Click the button below to continue.</p>

<button id="join">Join Group</button>

<div class="status" id="status"></div>

  </main>  <script>
    const button = document.getElementById("join");
    const status = document.getElementById("status");

    button.addEventListener("click", () => {
      button.disabled = true;
      button.textContent = "Opening...";
      status.textContent = "Please wait...";

      window.location.href = "/api/join";
    });
  </script></body>
</html>
